(SUCRE)", "lat": -3.18918, "lon": -79.85765, "n": 31, "emer": 0, "cuadrillas": []}, {"p": "ABAÑÍN", "lat": -3.3391, "lon": -79.53237, "n": 25, "emer": 0, "cuadrillas": []}, {"p": "JUAN BAUTISTA AGUIRRE (LOS TINTOS)", "lat": -1.9485, "lon": -79.88721, "n": 21, "emer": 7, "cuadrillas": [["ROBERTO BRIONES", 4], ["EDINSON QUIÑONEZ", 1], ["JOHNNY GARCIA", 1], ["TOMMY SAMANIEGO", 1]]}, {"p": "CASACAY", "lat": -3.32085, "lon": -79.71364, "n": 18, "emer": 0, "cuadrillas": []}, {"p": "TENDALES (CAB.EN PUERTO TENDALES)", "lat": -3.12094, "lon": -79.84961, "n": 16, "emer": 0, "cuadrillas": []}, {"p": "LA PEAÑA", "lat": -3.31155, "lon": -79.85302, "n": 14, "emer": 0, "cuadrillas": []}, {"p": "CHILLA", "lat": -3.36644, "lon": -79.48354, "n": 11, "emer": 0, "cuadrillas": []}, {"p": "BUENAVISTA", "lat": -3.36273, "lon": -79.82482, "n": 10, "emer": 0, "cuadrillas": []}, {"p": "BABA", "lat": -1.86559, "lon": -79.67263, "n": 9, "emer": 0, "cuadrillas": []}, {"p": "PUCARÁ", "lat": -3.31466, "lon": -79.59531, "n": 9, "emer": 0, "cuadrillas": []}, {"p": "DAULE", "lat": -1.95584, "lon": -79.90163, "n": 8, "emer": 5, "cuadrillas": [["ROBERTO BRIONES", 2], ["CARLOS PEREZ", 1], ["HAROLD VELOZ", 1], ["ORELLANA MEZA WILLIAM BOLIVAR", 1]]}, {"p": "VICTORIA", "lat": -3.39419, "lon": -79.86404, "n": 8, "emer": 0, "cuadrillas": []}, {"p": "BOCANA", "lat": -1.89731, "lon": -79.74917, "n": 6, "emer": 0, "cuadrillas": []}, {"p": "EL CAMBIO", "lat": -3.25874, "lon": -79.87329, "n": 6, "emer": 0, "cuadrillas": []}, {"p": "LA IBERIA", "lat": -3.22845, "lon": -79.88829, "n": 6, "emer": 0, "cuadrillas": []}, {"p": "SANTA LUCÍA", "lat": -1.75004, "lon": -79.91555, "n": 3, "emer": 2, "cuadrillas": [["CARLOS ANDRADE", 1], ["TOMMY SAMANIEGO", 1]]}];
const m = L.map('map',{scrollWheelZoom:true}).setView([-1.83,-78.18],7);
// Encuadre inicial: Ecuador continental completo, para situar las parroquias en el pais.
// Con el zoom bajo las burbujas quedan visibles como referencia; al acercar aparece el detalle.

// Tiles de OpenStreetMap: libres, sin API key. (CARTO pide key en algunos CDN
// y hacia que el mapa mostrara "API KEY REQUIRED" - corregido 2026-10-23.)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap contributors',subdomains:'abc',maxZoom:19,
   errorTileUrl:''}).addTo(m);
function col(e){ if(e>4000)return'#f85149'; if(e>1000)return'#d29922'; if(e>100)return'#3fb950'; if(e>0)return'#8b949e'; return'#f0883e'; }
// Radio escalado por zoom: con el pais completo (z7) las burbujas deben verse;
// al acercar se reducen para no tapar la zona.
function rad(e){ var z=m.getZoom(); var base=Math.max(9, Math.sqrt(e||1)*1.15);
  if(z<=7) return base*1.6; if(z==8) return base*1.25; if(z==9) return base; return base*0.8; }
D.forEach(function(d){
  const c=col(d.emer);
  L.circleMarker([d.lat,d.lon],{radius:rad(d.emer),color:c,fillColor:c,fillOpacity:.42,weight:2})
   .addTo(m)
   .bindPopup('<b>'+d.p+'</b><br>Tr&aacute;mites: '+d.n.toLocaleString('es-EC')+
     '<br>Emergencias: '+d.emer.toLocaleString('es-EC')+
     (d.cuadrillas.length?'<table>'+d.cuadrillas.map(function(x){
        return '<tr><td>'+x[0]+'</td><td><b>'+x[1]+'</b></td></tr>';}).join('')+'</table>':'<br><i>sin cuadrilla registrada</i>'))
   .bindTooltip(d.p,{className:'lf',direction:'top'});
});
D.forEach(function(d){ L.marker([d.lat,d.lon],{opacity:0.01}).addTo(m)
   .bindTooltip(d.p+' &mdash; '+d.emer.toLocaleString('es-EC')+' emerg.',{className:'lf'}); });

// Reajustar el tamano de las burbujas segun el zoom
var marcadores=[];
m.eachLayer(function(l){ if(l instanceof L.CircleMarker) marcadores.push(l); });
function ajustar(){ marcadores.forEach(function(l){ l.setRadius(rad(l.__emer||1)); }); }
marcadores.forEach(function(l,i){ l.__emer = D[i] ? D[i].emer : 1; });
m.on('zoomend', ajustar);
ajustar();

</script></body></html>
