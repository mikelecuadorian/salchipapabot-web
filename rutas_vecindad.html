const map = L.map('map',{zoomControl:true}).setView([-2.15,-79.86],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'OSM'}).addTo(map);
let capa = L.layerGroup().addTo(map);
let activo = null;

// totales
let ta=0,tv=0;
Object.values(D).forEach(v=>{ta+=v.km_act;tv+=v.km_vec;});
document.getElementById('tot').innerHTML =
  'Recorrido actual <b>'+ta.toFixed(0)+' km</b><br>Con vecindad <b>'+tv.toFixed(0)+
  ' km</b><br><span class="ah">Ahorro '+(100*(1-tv/ta)).toFixed(1)+'% · '+
  (ta-tv).toFixed(0)+' km menos</span>';

const lista = document.getElementById('lista');
const orden = Object.keys(D).sort((a,b)=>(D[b].km_act-D[b].km_vec)-(D[a].km_act-D[a].km_vec));
orden.forEach(c=>{
  const v=D[c], ah=100*(1-v.km_vec/v.km_act);
  const d=document.createElement('div');
  d.className='item'; d.dataset.c=c;
  d.innerHTML='<div class="nm">'+c+'</div>'+
    '<div class="km"><span>'+v.actual.length+' trámites</span>'+
    '<span class="ah">−'+ah.toFixed(0)+'%</span></div>'+
    '<div class="km"><span>'+v.km_act+' → '+v.km_vec+' km</span></div>'+
    '<div class="bar"><div style="width:'+Math.min(100,ah)+'%"></div></div>';
  d.onclick=()=>sel(c);
  lista.appendChild(d);
});

function linea(pts,color,peso){
  const ll = pts.map(p=>[p[0],p[1]]);
  return L.polyline(ll,{color,weight:peso,opacity:color==='#f85149'?0.55:0.95,
    dashArray:color==='#f85149'?'4,6':null}).addTo(capa);
}
function puntos(pts,color){
  pts.forEach((p,i)=>{
    L.circleMarker([p[0],p[1]],{radius:p===pts[0]?6:3.5,color,weight:1,
      fillColor:color,fillOpacity:0.9})
     .bindPopup('<b>#'+(i+1)+'</b> '+p[2]+'<br>'+p[3]).addTo(capa);
  });
}

function sel(c){
  capa.clearLayers();
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.c===c));
  if(activo===c){activo=null;map.setView([-2.15,-79.86],11);return;}
  activo=c;
  const v=D[c];
  linea(v.actual,'#f85149',2.5);
  linea(v.ruta,'#3fb950',3.5);
  puntos(v.ruta,'#3fb950');
  const b=L.latLngBounds(v.ruta.map(p=>[p[0],p[1]]));
  map.fitBounds(b,{padding:[40,40],maxZoom:15});
}
// arrancar con la que mas ahorra
sel(orden[0]);
