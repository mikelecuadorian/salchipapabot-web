    '<span style="color:#8b949e">' + z.ncuad + ' cuadrillas · top ' + z.top1 + '%</span>' +
    '<hr style="border:0;border-top:1px solid #30363d;margin:6px 0">' +
    '<span style="font-size:11px">' + z.cuad + '</span></div>'
  );
  c.addTo(grupo);
});

// Escala de burbujas: en zoom bajo se achican para no tapar el mapa
map.on('zoomend', function(){
  var z = map.getZoom();
  var factor = Math.max(0.06, Math.min(1, Math.pow(1.55, z - 12)));
  grupo.eachLayer(function(l){
    if (l._zonaR === undefined) { l._zonaR = l.getRadius(); }
    l.setRadius(l._zonaR * factor);
  });
});
</script></body></html>
